<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 2rem;
            font-size: 2.5rem;
        }

        .upload-section {
            margin-bottom: 2rem;
            text-align: center;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            cursor: pointer;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .file-input-label {
            display: inline-block;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .file-input-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .canvas-container {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
            background: #f5f5f5;
            padding: 1rem;
            border-radius: 10px;
        }

        #memeCanvas {
            max-width: 100%;
            height: auto;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
        }

        #textInput {
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        #textInput:focus {
            outline: none;
            border-color: #ff6b6b;
        }

        .position-selector {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .position-option {
            flex: 1;
            min-width: 100px;
        }

        .position-option input[type="radio"] {
            display: none;
        }

        .position-option label {
            display: block;
            padding: 0.75rem 1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .position-option input[type="radio"]:checked + label {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            border-color: #ff6b6b;
        }

        .position-option label:hover {
            border-color: #ff6b6b;
            background: #f0f0f0;
        }

        .size-control {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        #fontSizeSlider {
            flex: 1;
            height: 8px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }

        #fontSizeSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
        }

        #fontSizeSlider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            border: none;
        }

        #fontSizeValue {
            min-width: 50px;
            text-align: center;
            font-weight: 600;
            color: #667eea;
        }

        .color-control {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        #textColorPicker {
            width: 80px;
            height: 40px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        #textColorPicker:hover {
            border-color: #ff6b6b;
        }

        .download-btn {
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            width: 100%;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .download-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .placeholder-text {
            text-align: center;
            color: #999;
            padding: 3rem;
            font-style: italic;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .container {
                padding: 1.5rem;
            }

            h1 {
                font-size: 2rem;
            }

            .position-selector {
                flex-direction: column;
            }

            .position-option {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭 Meme Generator</h1>
        
        <div class="upload-section">
            <div class="file-input-wrapper">
                <input type="file" id="imageInput" accept="image/*">
                <label for="imageInput" class="file-input-label">📷 Choose Image</label>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="memeCanvas"></canvas>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="textInput">Meme Text:</label>
                <input type="text" id="textInput" placeholder="Enter your meme text here...">
            </div>

            <div class="control-group">
                <label>Text Position:</label>
                <div class="position-selector">
                    <div class="position-option">
                        <input type="radio" id="positionTop" name="position" value="top" checked>
                        <label for="positionTop">Top</label>
                    </div>
                    <div class="position-option">
                        <input type="radio" id="positionCenter" name="position" value="center">
                        <label for="positionCenter">Center</label>
                    </div>
                    <div class="position-option">
                        <input type="radio" id="positionBottom" name="position" value="bottom">
                        <label for="positionBottom">Bottom</label>
                    </div>
                </div>
            </div>

            <div class="control-group">
                <label for="fontSizeSlider">Font Size:</label>
                <div class="size-control">
                    <input type="range" id="fontSizeSlider" min="20" max="100" value="50">
                    <span id="fontSizeValue">50px</span>
                </div>
            </div>

            <div class="control-group">
                <label for="textColorPicker">Text Color:</label>
                <div class="color-control">
                    <input type="color" id="textColorPicker" value="#FFFFFF">
                </div>
            </div>

            <button id="downloadBtn" class="download-btn" disabled>Download Meme</button>
        </div>
    </div>

    <script>
        // Get DOM elements
        const imageInput = document.getElementById('imageInput');
        const canvas = document.getElementById('memeCanvas');
        const ctx = canvas.getContext('2d');
        const textInput = document.getElementById('textInput');
        const positionRadios = document.querySelectorAll('input[name="position"]');
        const fontSizeSlider = document.getElementById('fontSizeSlider');
        const fontSizeValue = document.getElementById('fontSizeValue');
        const textColorPicker = document.getElementById('textColorPicker');
        const downloadBtn = document.getElementById('downloadBtn');

        // State variables
        let currentImage = null;
        let imageLoaded = false;

        // Load image function
        function loadImage() {
            const file = imageInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    currentImage = img;
                    imageLoaded = true;
                    
                    // Set canvas dimensions to match image
                    canvas.width = img.width;
                    canvas.height = img.height;
                    
                    // Enable download button
                    downloadBtn.disabled = false;
                    
                    // Draw the meme
                    drawMeme();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Main rendering function
        function drawMeme() {
            if (!imageLoaded || !currentImage) return;

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw image
            ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);

            // Get text and settings
            const text = textInput.value.trim();
            if (!text) return; // Don't draw text if empty

            const fontSize = parseInt(fontSizeSlider.value);
            const selectedPosition = document.querySelector('input[name="position"]:checked').value;

            // Calculate text position
            let x = canvas.width / 2; // Always centered horizontally
            let y;
            const padding = 30;

            switch(selectedPosition) {
                case 'top':
                    y = padding + fontSize / 2;
                    break;
                case 'center':
                    y = canvas.height / 2;
                    break;
                case 'bottom':
                    y = canvas.height - padding - fontSize / 2;
                    break;
                default:
                    y = canvas.height / 2;
            }

            // Set text styling
            ctx.font = `${fontSize}px Impact, Arial Black, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Calculate stroke width (proportional to font size) - thicker border
            const strokeWidth = fontSize / 8;
            ctx.lineWidth = strokeWidth;

            // Get selected text color
            const textColor = textColorPicker.value;

            // Draw black outline (stroke)
            ctx.strokeStyle = '#000000';
            ctx.strokeText(text, x, y);

            // Draw text fill with selected color
            ctx.fillStyle = textColor;
            ctx.fillText(text, x, y);
        }

        // Update meme function (event handler)
        function updateMeme() {
            if (imageLoaded) {
                drawMeme();
            }
        }

        // Download meme function
        function downloadMeme() {
            if (!imageLoaded) return;

            // Convert canvas to image data URL
            const dataURL = canvas.toDataURL('image/png');
            
            // Create download link
            const link = document.createElement('a');
            link.download = 'meme.png';
            link.href = dataURL;
            
            // Trigger download
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Update font size display
        function updateFontSizeDisplay() {
            fontSizeValue.textContent = `${fontSizeSlider.value}px`;
            updateMeme();
        }

        // Event listeners
        imageInput.addEventListener('change', loadImage);
        textInput.addEventListener('input', updateMeme);
        fontSizeSlider.addEventListener('input', updateFontSizeDisplay);
        textColorPicker.addEventListener('input', updateMeme);
        positionRadios.forEach(radio => {
            radio.addEventListener('change', updateMeme);
        });
        downloadBtn.addEventListener('click', downloadMeme);

        // Initialize font size display
        updateFontSizeDisplay();
    </script>
</body>
</html>
